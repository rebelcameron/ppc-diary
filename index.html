let CURRENT_SESSION = null;

function sbAuthHeaders() {
  const token = CURRENT_SESSION?.access_token || SUPABASE_KEY;
  return {"apikey":SUPABASE_KEY,"Authorization":"Bearer "+token};
}
async function sbAuthPost(action, body) {
  const res = await fetch(SUPABASE_URL + "/auth/v1/" + action, {
    method:"POST",
    headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
    body:JSON.stringify(body),
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.msg || data.error_description || data.message || `Auth failed (${res.status})`);
  return data;
}
async function sbLogin(email, password) {
  const data = await sbAuthPost("token?grant_type=password", {email, password});
  CURRENT_SESSION = data; localStorage.setItem(SESSION_KEY, JSON.stringify(data));
  return data;
}
async function sbRefresh() {
  if (!CURRENT_SESSION?.refresh_token) return null;
  try {
    const data = await sbAuthPost("token?grant_type=refresh_token", {refresh_token: CURRENT_SESSION.refresh_token});
    CURRENT_SESSION = data; localStorage.setItem(SESSION_KEY, JSON.stringify(data));
    return data;
  } catch(e) { return null; }
}
function sbLogout() {
  CURRENT_SESSION = null;
  localStorage.removeItem(SESSION_KEY);
}

async function sbFetch(path, options = {}) {
  const doFetch = () => fetch(SUPABASE_URL + "/rest/v1/" + path, {
    ...options,
    headers: {...sbAuthHeaders(),"Content-Type":"application/json","Prefer":options.prefer||"",...(options.headers||{})},
  });
  let res = await doFetch();
  if (res.status === 401 && CURRENT_SESSION) {
    const refreshed = await sbRefresh();
    if (refreshed) res = await doFetch();
    else { sbLogout(); window.location.reload(); return null; }
  }
  if (!res.ok) { const err = await res.text(); throw new Error("Supabase error: " + err); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

  ]);
  const campaignNameMap={},adGroupNameMap={};
  if (campaignsRes?.values?.length>1){const headers=campaignsRes.values[0].map(h=>h.trim().toLowerCase());const idIdx=headers.findIndex(h=>h==="id"||h==="campaign id");const nameIdx=headers.findIndex(h=>h==="name"||h==="campaign name");if(idIdx>=0&&nameIdx>=0)campaignsRes.values.slice(1).forEach(row=>{const id=(row[idIdx]||"").trim();const name=(row[nameIdx]||"").trim();if(id&&name)campaignNameMap[id]=name;});}

  const rows=eventsRes?.values||[];
  if (rows.length<2) throw new Error("Sheet appears empty");
  const headers=rows[0];
  const HEADER_MAP={"Change Date":"Change Date","Change Resource Type":"Change Resource Type","Change Resource Name":"Change Resource Name","Change Client Type":"Change Client Type","Change User Email":"Change User Email","Change Old Resource":"Change Old Resource","Change New Resource":"Change New Resource","Change Operation":"Change Operation","Change Fields":"Change Fields","Change Campaign":"Change Campaign","Change Ad Group":"Change Ad Group","Change Asset":"Change Asset"};
  const events=rows.slice(1).map(row=>{const obj={};headers.forEach((h,i)=>{const mapped=HEADER_MAP[h.trim()]||h.trim();obj[mapped]=(row[i]||"").trim();});return obj;});

function fmtMicros(v){if(!v)return null;const n=parseInt(v,10);if(isNaN(n))return null;return"$"+(n/1_000_000).toFixed(2);}
function parseDate(d){if(!d)return null;const n=d.trim().replace(" ","T").replace(/T(\d):/,"T0$1:");const dt=new Date(n);return isNaN(dt.getTime())?null:dt;}
function fmtDate(d){const dt=parseDate(d);if(!dt)return"—";return dt.toLocaleDateString("en-ZA",{day:"2-digit",month:"short",year:"numeric"});}
function fmtDateTime(d){const dt=parseDate(d);if(!dt)return"—";return dt.toLocaleString("en-ZA",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});}
function daysUntil(dateStr){if(!dateStr)return null;const diff=new Date(dateStr)-new Date();return Math.ceil(diff/(1000*60*60*24));}
function fmtCheckDate(dateStr){if(!dateStr)return"";const d=new Date(dateStr);return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});}

function scoreSignificance(resType,op,fields,oldObj,newObj){
  const rootOld=Object.values(oldObj)[0]||{},rootNew=Object.values(newObj)[0]||{};
  if(fields.some(f=>f.includes("biddingStrategy")||f.includes("targetImpressionShare")||f.includes("maximizeConversions")||f.includes("targetRoas")))return"high";
  if(resType==="CAMPAIGN"&&fields.includes("status")){if(rootOld.status==="ENABLED"&&rootNew.status==="PAUSED")return"high";if(rootOld.status==="PAUSED"&&rootNew.status==="ENABLED")return"high";}
  if(resType==="CAMPAIGN_BUDGET"&&fields.includes("amountMicros")){const oldAmt=parseInt(rootOld.amountMicros||0),newAmt=parseInt(rootNew.amountMicros||0);if(oldAmt>0&&Math.abs(newAmt-oldAmt)/oldAmt>0.2)return"high";return"medium";}
  if(resType==="CAMPAIGN"&&op==="CREATE")return"high";
  if(resType==="AD"&&fields.some(f=>f.includes("headline")||f.includes("description")))return"medium";
  if(resType==="AD_GROUP"&&(op==="CREATE"||fields.includes("status")))return"medium";
  if(resType==="CAMPAIGN"&&fields.includes("name"))return"medium";
  if(fields.some(f=>f.includes("geoTargetType")||f.includes("networkSettings")||f.includes("targetingSetting")))return"medium";
  if(resType==="ASSET"&&op==="CREATE")return"medium";
  return"low";
}

    const sl=rootOld?.sitelinkAsset?.linkText;if(sl)return`Removed sitelink: "${sl}"`;

    if(fields.some(f=>f.includes("biddingStrategy")))return"Changed portfolio bidding strategy";
    if(fields.includes("status")){const from=rootOld?.status||"",to=rootNew?.status||"";const entity={CAMPAIGN:"Campaign",AD_GROUP:"Ad group",AD_GROUP_CRITERION:"Keyword/criterion",AD_GROUP_AD:"Ad",CUSTOMER_ASSET:"Account asset",CAMPAIGN_ASSET:"Campaign asset"}[resType]||resType.toLowerCase().replace(/_/g," ");if(from&&to)return`${entity} ${to==="PAUSED"?"paused":to==="ENABLED"?"enabled":to.toLowerCase()}`;return`${entity} status updated`;}
    if(fields.includes("amountMicros")){const oldA=fmtMicros(rootOld?.amountMicros),newA=fmtMicros(rootNew?.amountMicros);if(oldA&&newA){const oldN=parseInt(rootOld.amountMicros),newN=parseInt(rootNew.amountMicros);const pct=Math.round(Math.abs(newN-oldN)/oldN*100);return`Daily budget ${newN>oldN?"increased":"decreased"} ${oldA} → ${newA} (${pct}%)`;}return"Updated daily budget";}
    if(fields.includes("name")){const oldN=rootOld?.name||"",newN=rootNew?.name||"";if(oldN&&newN)return`Renamed: "${oldN}" → "${newN}"`;return"Renamed";}

function extractContext(resType,op,fields,oldObj,newObj){
  const rootNew=Object.values(newObj)[0]||{},rootOld=Object.values(oldObj)[0]||{};
  const active=Object.keys(rootNew).length?rootNew:rootOld;const ctx={};
  if(active.keyword?.text){ctx.keyword=active.keyword.text;ctx.matchType=active.keyword.matchType;ctx.negative=active.negative;}
  const ptVal=active.listingGroup?.caseValue?.productType?.value;const pcVal=active.listingGroup?.caseValue?.productCustomAttribute?.value;
  if(ptVal)ctx.productGroup=ptVal;else if(pcVal)ctx.productGroup=pcVal;
  if(active.amountMicros)ctx.budget=active.amountMicros;
  if(fields.some(f=>f.includes("targetImpressionShare")))ctx.bidStrategy="Target IS";
  else if(fields.some(f=>f.includes("maximizeConversions")&&f.includes("targetCpa")))ctx.bidStrategy="Max Conv (tCPA)";
  else if(fields.some(f=>f.includes("targetRoas")))ctx.bidStrategy="Target ROAS";
  else if(fields.some(f=>f.includes("maximizeConversionValue")))ctx.bidStrategy="Max Conv Value";
  else if(fields.some(f=>f.includes("biddingStrategy")))ctx.bidStrategy="Portfolio Strategy";
  if(fields.some(f=>f.includes("networkSettings")))ctx.network=true;
  if(active.sitelinkAsset?.linkText)ctx.sitelink=active.sitelinkAsset.linkText;
  if(resType==="CAMPAIGN"&&fields.includes("status")){ctx.statusFrom=rootOld.status;ctx.statusTo=rootNew.status;}
  if(resType==="AD_GROUP"&&fields.includes("name")){ctx.adGroupName=rootNew.name||rootOld.name;}
  return ctx;
}

function parseCSV(text){
  const lines=text.trim().split("\n");const headers=lines[0].split(",").map(h=>h.trim().replace(/\r/,""));const rows=[];
  for(let i=1;i<lines.length;i++){const line=lines[i];const cols=[];let inQuote=false,cur="";for(let ci=0;ci<line.length;ci++){const c=line[ci];if(c==='"'){if(inQuote&&line[ci+1]==='"'){cur+='"';ci++;}else inQuote=!inQuote;}else if(c===","&&!inQuote){cols.push(cur.trim());cur="";}else cur+=c;}cols.push(cur.trim());const row={};headers.forEach((h,idx)=>{row[h]=(cols[idx]||"").replace(/\r/,"");});rows.push(row);}
  return rows;
}

function processEvent(row,idx){
  const campRaw=row["Change Campaign"]||"";const campSuffix=campRaw.split("/campaigns/")[1];const campKey=campSuffix?"c/"+campSuffix:"";
  const agRaw=row["Change Ad Group"]||"";const agId=agRaw.split("/adGroups/")[1]||"";
  const resType=row["Change Resource Type"]||"";const op=row["Change Operation"]||"";
  const fields=(row["Change Fields"]||"").split(",").map(f=>f.trim()).filter(Boolean);
  const user=row["Change User Email"]||"";
  const userName=user.includes("cameron")?"Cameron":user.includes("david")||user.includes("David")?"David":user.split("@")[0];
  const clientType=row["Change Client Type"]||"";
  const campName=campKey?(CAMPAIGN_NAMES[campKey]||"Campaign "+campSuffix):"Account-level";
  let oldObj={},newObj={};
  try{oldObj=JSON.parse(row["Change Old Resource"]||"{}");}catch(e){}
  try{newObj=JSON.parse(row["Change New Resource"]||"{}");}catch(e){}
  const summary=buildSummary(resType,op,fields,oldObj,newObj);
  const significance=scoreSignificance(resType,op,fields,oldObj,newObj);
  const context=extractContext(resType,op,fields,oldObj,newObj);
  const resName=(row["Change Resource Name"]||"").split("/").slice(-1)[0]||idx;
  const accountId=(row["Change Resource Name"]||"").split("/")[1]||"unknown";
  const stableId=`${accountId}_${(row["Change Date"]||"").replace(/[^0-9]/g,"")}_${resName}_${op}`;
  return{id:stableId,accountId,date:row["Change Date"]||"",resourceType:resType,op,fields,user,userName,clientType,campaignKey:campKey,campaignName:campName,adGroupId:agId,oldObj,newObj,summary,significance,context,oldResource:row["Change Old Resource"]||"",newResource:row["Change New Resource"]||""};
}

function buildAdGroupNameMap(events){
  const map={};
  for(const e of events){const agId=e.adGroupId;if(!agId)continue;if(e.resourceType==="AD_GROUP"){const newName=Object.values(e.newObj)[0]?.name;const oldName=Object.values(e.oldObj)[0]?.name;if(newName)map[agId]=newName;else if(oldName&&!map[agId])map[agId]=oldName;}const tryObj=(obj)=>{const root=Object.values(obj)[0]||{};if(root.adGroup?.name)map[agId]=root.adGroup.name;if(root.name&&e.resourceType==="AD_GROUP")map[agId]=root.name;};tryObj(e.newObj);tryObj(e.oldObj);if(e.context?.adGroupName&&agId)map[agId]=e.context.adGroupName;}
  return map;
}

function buildCampaignNameMap(events){
  const map={};
  for(const e of events){const campKey=e.campaignKey;if(!campKey)continue;const tryExtract=(obj)=>{if(!obj||typeof obj!=="object")return;const root=Object.values(obj)[0]||{};if(e.resourceType==="CAMPAIGN"&&root.name){map[campKey]=root.name;return;}if(root.campaign?.name){map[campKey]=root.campaign.name;return;}for(const val of Object.values(root)){if(val&&typeof val==="object"&&val.name&&val.resourceName?.includes("/campaigns/")){map[campKey]=val.name;return;}}};tryExtract(e.newObj);if(!map[campKey])tryExtract(e.oldObj);if(!map[campKey]&&CAMPAIGN_NAMES[campKey])map[campKey]=CAMPAIGN_NAMES[campKey];}
  return map;
}

function groupEvents(events,groupingOn){
  if(!groupingOn)return events.map(e=>({...e,isGroup:false,groupEvents:null}));
  const groups=[],used=new Set();
  for(let i=0;i<events.length;i++){if(used.has(i))continue;const e=events[i],eTime=parseDate(e.date)?.getTime()||0;const cluster=[e];for(let j=i+1;j<events.length;j++){if(used.has(j))continue;const f=events[j];if(f.campaignKey!==e.campaignKey||f.user!==e.user)continue;const fTime=parseDate(f.date)?.getTime()||0;if(Math.abs(fTime-eTime)>3*60*1000)continue;cluster.push(f);used.add(j);}used.add(i);if(cluster.length===1){groups.push({...e,isGroup:false,groupEvents:null});}else{const highSig=cluster.find(c=>c.significance==="high")||cluster[0];const types=[...new Set(cluster.map(c=>c.resourceType))];groups.push({...highSig,id:`grp-${i}`,isGroup:true,groupCount:cluster.length,groupEvents:cluster,summary:`${cluster.length} changes — ${types.map(t=>TYPE_LABELS[t]||t.replace(/_/g," ").toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())).join(", ")}`,significance:highSig.significance});}}
  return groups;
}

function flattenObj(obj,prefix=""){const out={};if(!obj||typeof obj!=="object")return out;for(const[k,v]of Object.entries(obj)){const key=prefix?`${prefix}.${k}`:k;if(v&&typeof v==="object"&&!Array.isArray(v))Object.assign(out,flattenObj(v,key));else out[key]=Array.isArray(v)?JSON.stringify(v):String(v??"");}return out;}

function renderDiff(evt){
  const op=evt.op||evt.operation;
  if(op==="CREATE"||op==="REMOVE"){const obj=op==="CREATE"?evt.newObj:evt.oldObj,root=Object.values(obj)[0]||{},flat=flattenObj(root);const interesting=Object.entries(flat).filter(([k])=>!["resourceName","criterionId","adGroup","campaign","id"].some(x=>k.includes(x))).slice(0,8);if(!interesting.length)return null;return(<div className="diff-section"><div className="diff-title">{op==="CREATE"?"Created with":"Was"}</div><div className="diff-card">{interesting.map(([k,v])=>{const display=k.includes("Micros")?(fmtMicros(v)||v):v.length>100?v.slice(0,100)+"…":v;return(<div key={k} style={{marginBottom:5}}><div className="diff-field">{k.split(".").pop()}</div><div className={op==="CREATE"?"diff-new":"diff-old"} style={{display:"inline-block"}}>{display}</div></div>);})}</div></div>);}
  const oldRoot=Object.values(evt.oldObj)[0]||{},newRoot=Object.values(evt.newObj)[0]||{};const oldFlat=flattenObj(oldRoot),newFlat=flattenObj(newRoot);const allKeys=new Set([...Object.keys(oldFlat),...Object.keys(newFlat)]);const diffs=[];for(const k of allKeys){const o=oldFlat[k],n=newFlat[k];if(o!==n)diffs.push({k,o:o??"",n:n??""});}
  if(!diffs.length)return<div style={{fontSize:11,color:"var(--muted)",fontFamily:"var(--mono)"}}>Fields: {evt.fields.join(", ")}</div>;
  const fmt=(k,v)=>{if(!v)return<span style={{opacity:.4}}>—</span>;if(k.includes("Micros"))return fmtMicros(v)||v;return v.length>100?v.slice(0,100)+"…":v;};
  return(<div className="diff-section"><div className="diff-title">What changed</div>{diffs.slice(0,6).map(({k,o,n})=>(<div className="diff-card" key={k}><div className="diff-field">{k.split(".").pop()}</div><div className="diff-row"><div><div className="diff-label">Before</div><div className="diff-old">{fmt(k,o)}</div></div><div><div className="diff-label">After</div><div className="diff-new">{fmt(k,n)}</div></div></div></div>))}</div>);
}

async function fetchAIInsight(evt,apiKey){
  if(!apiKey)throw new Error("No API key set");
  const op=evt.op||evt.operation;
  const prompt=`You are a Google Ads expert. A change was made to a Google Ads account. Explain in 1-2 plain English sentences what this change means and what the likely intent or impact is. Be specific and practical. No jargon. No bullet points.\n\nChange: ${evt.summary}\nCampaign: ${evt.campaignName}\nResource type: ${evt.resourceType}\nOperation: ${op}\nFields changed: ${(evt.fields||[]).join(", ")}\nOld state: ${JSON.stringify(evt.oldObj).slice(0,400)}\nNew state: ${JSON.stringify(evt.newObj).slice(0,400)}`;
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:200,messages:[{role:"user",content:prompt}]})});
  if(!res.ok){const errText=await res.text();let msg=errText;try{const j=JSON.parse(errText);msg=j.error?.message||j.message||errText;}catch(e){}throw new Error(`Anthropic ${res.status}: ${msg}`);}
  const data=await res.json();
  return data.content?.find(b=>b.type==="text")?.text||"";
}

  negative_added:{label:"Negative keyword added",hint:"Fires when a negative keyword is added",direction:false,threshold:false,matches:e=>e.resourceType==="AD_GROUP_CRITERION"&&e.op==="CREATE"&&!!Object.values(e.newObj||{})[0]?.keyword&&!!Object.values(e.newObj||{})[0]?.negative},
};

function ruleMatchesEvent(rule,evt){
  const preset=RULE_PRESETS[rule.preset_type];
  if(!preset||!preset.matches(evt))return false;
  if(preset.direction&&rule.direction&&rule.direction!=="any"&&preset.getValues){
    const v=preset.getValues(evt);
    if(rule.direction==="up"&&!(v.new>v.old))return false;
    if(rule.direction==="down"&&!(v.new<v.old))return false;
  }
  if(preset.threshold&&Number(rule.min_pct_change||0)>0&&preset.getValues){
    const v=preset.getValues(evt);
    if(!v.old)return false;
    const pct=Math.abs((v.new-v.old)/v.old)*100;
    if(pct<Number(rule.min_pct_change))return false;
  }
  return true;
}

function applyRulesToEvents(rules,events,existingExperiments){
  const updates={};
  if(!rules?.length||!events?.length)return updates;
  for(const evt of events){
    if(existingExperiments?.[evt.id])continue;
    for(const rule of rules){
      if(!rule.enabled)continue;
      if(!ruleMatchesEvent(rule,evt))continue;
      const eventDate=parseDate(evt.date)||new Date();
      const checkDate=new Date(eventDate.getTime()+(Number(rule.days_offset)||14)*86400000);
      const hypothesis=(rule.hypothesis_template||"Auto-watch: {summary}").replace(/\{summary\}/g,evt.summary||"");
      updates[evt.id]={
        hypothesis,
        checkDate:checkDate.toISOString().slice(0,10),
        eventId:evt.id,
        createdAt:new Date().toISOString(),
        source:{type:"rule",ruleId:rule.id,ruleName:rule.name}
      };
      break;
    }
  }
  return updates;
}

function LoginScreen({onLogin}) {
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);
  const submit=async(e)=>{
    e.preventDefault();
    setError("");setLoading(true);
    try { const s=await sbLogin(email.trim(),password); onLogin(s); }
    catch(err){ setError(err.message); }
    finally{ setLoading(false); }
  };
  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#fafafa",fontFamily:"'Inter',sans-serif"}}>
      <form onSubmit={submit} style={{background:"#fff",border:"1px solid #e8eaed",borderRadius:12,padding:32,width:380,maxWidth:"92vw",boxShadow:"0 8px 30px rgba(0,0,0,.06)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
          <div style={{width:32,height:32,borderRadius:8,background:"#2563eb",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700}}>P</div>
          <div style={{fontSize:18,fontWeight:600,color:"#111827"}}>PPC Diary</div>
        </div>
        <div style={{fontSize:13,color:"#6b7280",marginBottom:18}}>Sign in to access your diary.</div>
        <label style={{display:"block",fontSize:11,fontWeight:600,color:"#6b7280",marginBottom:4,textTransform:"uppercase",letterSpacing:.5}}>Email</label>
        <input type="email" autoComplete="email" required value={email} onChange={e=>setEmail(e.target.value)} style={{width:"100%",padding:"9px 12px",border:"1px solid #d1d5db",borderRadius:7,fontSize:14,marginBottom:14,outline:"none",fontFamily:"inherit"}}/>
        <label style={{display:"block",fontSize:11,fontWeight:600,color:"#6b7280",marginBottom:4,textTransform:"uppercase",letterSpacing:.5}}>Password</label>
        <input type="password" autoComplete="current-password" required value={password} onChange={e=>setPassword(e.target.value)} style={{width:"100%",padding:"9px 12px",border:"1px solid #d1d5db",borderRadius:7,fontSize:14,marginBottom:18,outline:"none",fontFamily:"inherit"}}/>
        {error&&<div style={{fontSize:12,color:"#dc2626",background:"#fef2f2",border:"1px solid #fecaca",borderRadius:6,padding:"8px 10px",marginBottom:14}}>{error}</div>}
        <button type="submit" disabled={loading} style={{width:"100%",padding:"10px 14px",background:"#2563eb",color:"#fff",border:"none",borderRadius:7,fontSize:14,fontWeight:600,cursor:loading?"default":"pointer",opacity:loading?.6:1,fontFamily:"inherit"}}>{loading?"Signing in…":"Sign in"}</button>
      </form>
    </div>
  );
}

  const loadAccountData=async(accountId)=>{
    setActiveAccountState(accountId);setSelectedId(null);setEvents([]);setNotes({});setLinks({});setAiCache({});setExperiments({});setRules([]);
    let loadedExperiments={},loadedRules=[],loadedEvents=[];
    try{
      setImportMsg({type:"success",text:"Loading from database…"});
      const{events,notes,links,experiments}=await sbLoadAccount(accountId);
      loadedEvents=events;loadedExperiments=experiments;
      setEvents(events.length?events:[]);setNotes(notes);setLinks(links);setExperiments(experiments);

    }catch(err){setImportMsg({type:"error",text:"Could not load from database: "+err.message});setTimeout(()=>setImportMsg(null),6000);}

          if(!rows.length)return;

          if(Object.keys(campaignNameMap).length>0){localStorage.setItem("ppc-camp-names",JSON.stringify(campaignNameMap));setSheetCampaignNames(campaignNameMap);}
          if(Object.keys(adGroupNameMap).length>0){localStorage.setItem("ppc-ag-names",JSON.stringify(adGroupNameMap));setSheetAdGroupNames(adGroupNameMap);}
          incoming.forEach(e=>{const campId=e.campaignKey?.replace("c/","");if(campId&&campaignNameMap[campId])e.campaignName=campaignNameMap[campId];if(e.adGroupId&&adGroupNameMap[e.adGroupId])e.adGroupName=adGroupNameMap[e.adGroupId];});
          let mergedEvents=[];
          setEvents(prev=>{const existingMap=Object.fromEntries(prev.map(e=>[e.id,e]));const incomingMap=Object.fromEntries(incoming.map(e=>[e.id,e]));const merged=[...incoming.map(e=>({...existingMap[e.id],...e})),...prev.filter(e=>!incomingMap[e.id])];merged.sort((a,b)=>new Date(b.date)-new Date(a.date));mergedEvents=merged;return merged;});
          sbSaveEvents(accountId,incoming).catch(console.error);
          applyRulesAndPersist(loadedRules,mergedEvents,loadedExperiments,accountId);
          setImportMsg({type:"success",text:`Sheet synced — ${incoming.length} events`});

  const applyRulesAndPersist=async(rulesArr,eventsArr,currentExperiments,accountId)=>{

    await Promise.all(ids.map(eid=>sbSaveWatchItem(accountId,eid,newItems[eid]).catch(console.error)));
    return newItems;
  };

    })();

    setShowAccountModal(false);setAccountForm({name:"",color:"#60a5fa",sheetId:""});switchAccount(id);

  };

  const handleSaveRule=async()=>{
    if(!activeAccount||!ruleForm.preset_type)return;

    try{await sbSaveRule(activeAccount,rule);}catch(err){setImportMsg({type:"error",text:"Could not save rule: "+err.message+" (did you run the SQL?)"});setTimeout(()=>setImportMsg(null),8000);return;}
    const nextRules=ruleForm.id?rules.map(r=>r.id===id?rule:r):[...rules,rule];
    setRules(nextRules);
    const created=await applyRulesAndPersist([rule],events,experiments,activeAccount);
    const count=Object.keys(created).length;
    setImportMsg({type:"success",text:ruleForm.id?`Rule updated · ${count} new watch item${count===1?"":"s"} from backfill`:`Rule saved · ${count} watch item${count===1?"":"s"} created from history`});
    setTimeout(()=>setImportMsg(null),5000);
    setRuleForm({id:null,name:"",preset_type:"tcpa_changed",direction:"any",min_pct_change:0,days_offset:14,hypothesis_template:"Auto-watch: {summary}",enabled:true,show:false});
  };
  const handleEditRule=(rule)=>{
    setRuleForm({id:rule.id,name:rule.name||"",preset_type:rule.preset_type,direction:rule.direction||"any",min_pct_change:rule.min_pct_change||0,days_offset:rule.days_offset||14,hypothesis_template:rule.hypothesis_template||"Auto-watch: {summary}",enabled:rule.enabled!==false,show:true});
  };
  const handleDeleteRule=async(ruleId)=>{
    if(!activeAccount)return;
    try{await sbDeleteRule(activeAccount,ruleId);}catch(e){console.error(e);}
    setRules(rs=>rs.filter(r=>r.id!==ruleId));
  };
  const handleToggleRule=async(rule)=>{

    setRules(rs=>rs.map(r=>r.id===rule.id?updated:r));

  const saveExperiments=(updated,changedId=null)=>{

  // ── NEW: open the edit form pre-filled with existing data
  const handleEditExp=(eventId)=>{

    setExpForm({hypothesis:exp.hypothesis,checkDate:exp.checkDate||"",show:true});

  const handleDeleteExp=(eventId)=>{const updated={...experiments};delete updated[eventId];saveExperiments(updated,eventId);};

  const handleSaveVerdict=(eventId)=>{
    if(!expOutcomeForm.verdict)return;
    const updated={...experiments,[eventId]:{...experiments[eventId],verdict:expOutcomeForm.verdict,outcomeNote:expOutcomeForm.outcomeNote,concludedAt:new Date().toISOString()}};
    saveExperiments(updated,expOutcomeForm.eventId);setExpOutcomeForm({eventId:null,verdict:null,outcomeNote:""});

  const saveNotes=(updated,changedId=null)=>{setNotes(updated);if(activeAccount&&changedId)sbSaveNote(activeAccount,changedId,updated[changedId]).catch(console.error);};
  const saveAiCache=(updated)=>{setAiCache(updated);if(activeAccount)window._localSet(storageKey("ai",activeAccount),JSON.stringify(updated));};
  const saveLinks=(updated,changedIds=null)=>{setLinks(updated);if(!activeAccount||!changedIds)return;const ids=Array.isArray(changedIds)?changedIds:[changedIds];ids.forEach(id=>sbSaveLinks(activeAccount,id,updated[id]||[]).catch(console.error));};

  const handleAddLink=(targetId)=>{

  const syncFromSheet=async()=>{

      incoming.forEach(e=>{const campId=e.campaignKey?.replace("c/","");if(campId&&campaignNameMap[campId])e.campaignName=campaignNameMap[campId];if(e.adGroupId&&adGroupNameMap[e.adGroupId])e.adGroupName=adGroupNameMap[e.adGroupId];});
      let mergedEvents=[];
      setEvents(prev=>{const existingMap=Object.fromEntries(prev.map(e=>[e.id,e]));const incomingMap=Object.fromEntries(incoming.map(e=>[e.id,e]));const merged=[...incoming.map(e=>({...existingMap[e.id],...e})),...prev.filter(e=>!incomingMap[e.id])];merged.sort((a,b)=>new Date(b.date)-new Date(a.date));mergedEvents=merged;return merged;});

  const onBodyMouseMove=(e)=>{if(!dragRef.current)return;const{which,startX,startW}=dragRef.current;const delta=e.clientX-startX;if(which===1){const w=Math.max(220,Math.min(600,startW+delta));setCol1(w);bodyRef.current?.style.setProperty("--col1",w+"px");}else{const w=Math.max(260,Math.min(600,startW-delta));setCol3(w);bodyRef.current?.style.setProperty("--col3",w+"px");}};
  const onBodyMouseUp=()=>{dragRef.current=null;setIsDragging(false);};

  const filtered=useMemo(()=>{
    let list=events;

    if(filterOp!=="all")list=list.filter(e=>(e.op||e.operation)===filterOp);

    if(dateTo){const to=new Date(dateTo+"T23:59:59");list=list.filter(e=>{const d=parseDate(e.date);return d&&d<=to;});}
    if(search.trim()==="_noted_")list=list.filter(e=>notes[e.id]);

    const grouped=groupEvents(list,groupingOn);

  const linkResults=useMemo(()=>{if(!linkSearch.trim())return events.filter(e=>e.id!==selectedId).slice(0,30);const q=linkSearch.toLowerCase();return events.filter(e=>e.id!==selectedId&&(e.summary.toLowerCase().includes(q)||e.campaignName.toLowerCase().includes(q)||e.context?.keyword?.toLowerCase().includes(q))).slice(0,50);},[events,selectedId,linkSearch]);

  const linkedPairs=useMemo(()=>{const seen=new Set();const pairs=[];Object.entries(links).forEach(([evtId,evtLinks])=>{evtLinks.forEach(link=>{const key=[evtId,link.targetId].sort().join("__");if(seen.has(key))return;seen.add(key);const evtA=events.find(e=>e.id===evtId);const evtB=events.find(e=>e.id===link.targetId);if(!evtA||!evtB)return;const lt=LINK_TYPES.find(t=>t.id===link.type)||LINK_TYPES[5];pairs.push({key,evtA,evtB,lt,note:link.note,createdAt:link.createdAt});});});return pairs.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));},[links,events]);

  const selected=useMemo(()=>{if(!selectedId)return null;const direct=events.find(e=>e.id===selectedId);if(direct)return direct;for(const e of filtered){if(e.isGroup&&e.groupEvents){const child=e.groupEvents.find(c=>c.id===selectedId);if(child)return child;}}return null;},[events,selectedId,filtered]);

  const existingNote=selectedId?notes[selectedId]:null;

  const renderEventCard=(e,nested=false)=>{
    const op=e.op||e.operation,sig=e.significance||"low",sigCfg=SIG_CONFIG[sig],hasNote=!!notes[e.id],evtLinks=links[e.id]||[];

        <div className={["evt-item",(selectedId===e.id||(e.isGroup&&e.groupEvents?.some(c=>c.id===selectedId)))?"sel":"",hasNote?"has-note":sig==="high"?"sig-high":"",nested?"nested-card":""].filter(Boolean).join(" ")} onClick={()=>handleSelectEvent(e.isGroup&&e.groupEvents?.length?e.groupEvents[0].id:e.id)} style={nested?{background:"var(--bg)",marginBottom:2}:{}}>
          <div className="evt-meta">

            {importMsg&&(<div style={{padding:"5px 12px",borderRadius:7,fontSize:11,fontWeight:500,background:importMsg.type==="success"?"var(--green-bg)":"var(--red-bg)",border:`1px solid ${importMsg.type==="success"?"var(--green-border)":"var(--red-border)"}`,color:importMsg.type==="success"?"var(--green)":"var(--red)",display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap"}}>{importMsg.type==="success"?"✓":"✕"} {importMsg.text}</div>)}

                <span className={`ftag ${filterSigs.has("low")?"on":""}`} onClick={()=>setFilterSigs(s=>{const n=new Set(s);n.has("low")?n.delete("low"):n.add("low");return n;})}>Low</span>

              <div className="filter-strip">

              </div>
              <div className="filter-strip">
                <span className="fstrip-label">By</span>
                <span className={`ftag ${filterUser==="all"?"on":""}`} onClick={()=>setFilterUser("all")}>Everyone</span>
                {users.map(u=>{const label=u.includes("cameron")?"Cameron":u.includes("david")||u.includes("David")?"David":u.split("@")[0];return<span key={u} className={`ftag ${filterUser===u?"on":""}`} onClick={()=>setFilterUser(filterUser===u?"all":u)}>{label}</span>;})}
                <span style={{width:1,background:"var(--border)",margin:"2px 3px",flexShrink:0}}/>
                <span className="fstrip-label">Via</span>
                <span className={`ftag ${filterClient==="all"?"on":""}`} onClick={()=>setFilterClient("all")}>All</span>
                {clientTypes.map(ct=>(<span key={ct} className={`ftag ${filterClient===ct?"on":""}`} onClick={()=>setFilterClient(filterClient===ct?"all":ct)}>{CLIENT_LABELS[ct]||ct.replace(/_/g," ").toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())}</span>))}
              </div>
              <div className="stats-bar">
                {[{val:stats.total,label:"Total",onClick:()=>{setFilterOp("all");setFilterSigs(new Set());},active:filterOp==="all"&&filterSigs.size===0},{val:stats.high,label:"High",onClick:()=>setFilterSigs(s=>{const n=new Set(s);n.has("high")?n.delete("high"):n.add("high");return n;}),active:filterSigs.has("high")},{val:stats.updates,label:"Updates",onClick:()=>setFilterOp(filterOp==="UPDATE"?"all":"UPDATE"),active:filterOp==="UPDATE"},{val:stats.creates,label:"Creates",onClick:()=>setFilterOp(filterOp==="CREATE"?"all":"CREATE"),active:filterOp==="CREATE"},{val:stats.removes,label:"Removes",onClick:()=>setFilterOp(filterOp==="REMOVE"?"all":"REMOVE"),active:filterOp==="REMOVE"},{val:stats.noted,label:"Noted",onClick:()=>setSearch(search==="_noted_"?"":"_noted_"),active:search==="_noted_"},{val:stats.linked,label:"Linked",onClick:()=>setSearch(search==="_linked_"?"":"_linked_"),active:search==="_linked_"}].map(s=>(<div key={s.label} className={`stat${s.active?" stat-active":""}`} onClick={s.onClick}><div className="stat-val">{s.val}</div><div className="stat-label">{s.label}</div></div>))}
              </div>
              <div className="panel-scroll">
                {events.length===0?(
                  <div className={`upload-zone ${dragging?"drag":""}`} onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)} onDrop={e=>{e.preventDefault();setDragging(false);handleFile(e.dataTransfer.files[0]);}}>
                    <label style={{cursor:"pointer"}}><input type="file" accept=".csv" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/><div style={{fontSize:13,fontWeight:600,marginBottom:4}}>Drop CSV or click to import</div><div style={{fontSize:11,color:"var(--muted)"}}>Google Ads Change History export</div></label>

                    <div className="link-pair-connector"><div style={{width:2,height:16,background:lt.color+"60",borderRadius:1,marginLeft:10}}/><span style={{fontSize:10,color:lt.color,fontFamily:"var(--mono)"}}> {lt.label}</span></div>
                    <div className={`link-pair-evt ${selectedId===evtB.id?"active-evt":""}`} onClick={()=>{setView("events");handleSelectEvent(evtB.id);}}><div style={{display:"flex",alignItems:"center",gap:5,marginBottom:3}}><span style={{fontSize:11}}>{TYPE_ICONS[evtB.resourceType]||"⚙️"}</span><span className="evt-op" style={{background:(OP_COLORS[evtB.op||evtB.operation]||"#aaa")+"22",color:OP_COLORS[evtB.op||evtB.operation]||"#aaa",fontSize:9,padding:"1px 5px"}}>{evtB.op||evtB.operation}</span></div><div style={{fontSize:12,fontWeight:600,lineHeight:1.4,marginBottom:2}}>{evtB.summary}</div><div style={{fontSize:10,color:"var(--muted)",fontFamily:"var(--mono)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{evtB.campaignName}</div></div>

            {view==="experiments"&&(
              <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
                {(()=>{const allWatched=Object.values(experiments);const pending=allWatched.filter(e=>!e.verdict);const overdue=pending.filter(e=>e.checkDate&&daysUntil(e.checkDate)<0);const dueSoon=pending.filter(e=>e.checkDate&&daysUntil(e.checkDate)>=0&&daysUntil(e.checkDate)<=3);const worked=allWatched.filter(e=>e.verdict==="worked");return(<div className="exp-stats-row"><div className="exp-stat"><div className="exp-stat-val" style={{color:"var(--text)"}}>{allWatched.length}</div><div className="exp-stat-label">Total</div></div><div className="exp-stat"><div className="exp-stat-val" style={{color:overdue.length>0?"var(--red)":"var(--muted)"}}>{overdue.length}</div><div className="exp-stat-label">Overdue</div></div><div className="exp-stat"><div className="exp-stat-val" style={{color:dueSoon.length>0?"var(--yellow)":"var(--muted)"}}>{dueSoon.length}</div><div className="exp-stat-label">Due Soon</div></div><div className="exp-stat"><div className="exp-stat-val" style={{color:"var(--green)"}}>{worked.length}</div><div className="exp-stat-label">Worked</div></div></div>);})()}
                <div className="panel-scroll">
                  {Object.values(experiments).length===0?(<div className="empty-panel"><span className="ico"></span><span>No effects tracked yet.</span></div>):(()=>{

                    const pending=allWatched.filter(e=>!e.verdict).sort((a,b)=>{const da=daysUntil(a.checkDate)??999,db=daysUntil(b.checkDate)??999;return da-db;});
                    const concluded=allWatched.filter(e=>e.verdict).sort((a,b)=>new Date(b.concludedAt)-new Date(a.concludedAt));
                    const overdue=pending.filter(e=>e.checkDate&&daysUntil(e.checkDate)<0);
                    const thisWeek=pending.filter(e=>e.checkDate&&daysUntil(e.checkDate)>=0&&daysUntil(e.checkDate)<=7);
                    const later=pending.filter(e=>!e.checkDate||daysUntil(e.checkDate)>7);
                    const groups=[];
                    if(overdue.length)groups.push({label:"🔴 Overdue",items:overdue});
                    if(thisWeek.length)groups.push({label:"🟡 Check This Week",items:thisWeek});
                    if(later.length)groups.push({label:"📅 Upcoming",items:later});
                    if(concluded.length)groups.push({label:"✓ Concluded",items:concluded});
                    return groups.map(g=>(
                      <div key={g.label} className="exp-timeline-group">
                        <div className="exp-timeline-label">{g.label}</div>
                        {g.items.map(exp=>{
                          const evt=events.find(e=>e.id===exp.eventId);if(!evt)return null;
                          const days=daysUntil(exp.checkDate);
                          const verdict=VERDICTS.find(v=>v.id===exp.verdict);
                          const isOverdue=!exp.verdict&&exp.checkDate&&days<0;
                          const isDueSoon=!exp.verdict&&exp.checkDate&&days>=0&&days<=3;
                          return(
                            <div key={exp.eventId} className={`exp-card ${isOverdue?"overdue":""} ${isDueSoon?"due-soon":""} ${exp.verdict?"concluded":""}`} onClick={()=>{handleSelectEvent(exp.eventId);setView("events");}} style={{cursor:"pointer"}}>
                              <div style={{display:"flex",alignItems:"flex-start",gap:6,marginBottom:4}}>

          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.35)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>setShowRulesModal(false)}>
            <div style={{background:"var(--bg2)",border:"1px solid var(--border2)",borderRadius:12,padding:24,width:540,maxWidth:"92vw",maxHeight:"90vh",overflowY:"auto",boxShadow:"0 20px 60px rgba(0,0,0,.5)"}} onClick={e=>e.stopPropagation()}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                <div style={{fontSize:18,fontWeight:600}}>Watch List Rules</div>
                <button className="nc-btn" onClick={()=>setShowRulesModal(false)}>Close</button>
              </div>
              <div style={{fontSize:11,color:"var(--muted)",marginBottom:16,lineHeight:1.5}}>Auto-create a Watch List item whenever a matching change happens. Rules run on every sheet sync and backfill against existing events when created.</div>

              {rules.length>0&&(<div style={{marginBottom:18}}>
                {rules.map(r=>{const p=RULE_PRESETS[r.preset_type];return(
                  <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",border:"1px solid var(--border)",borderRadius:8,marginBottom:6,background:r.enabled?"var(--bg)":"var(--bg3)",opacity:r.enabled?1:.6}}>
                    <button onClick={()=>handleToggleRule(r)} title={r.enabled?"Disable":"Enable"} style={{width:32,height:18,borderRadius:10,border:"none",background:r.enabled?"var(--green)":"var(--border2)",position:"relative",cursor:"pointer",flexShrink:0,padding:0}}>
                      <span style={{position:"absolute",top:2,left:r.enabled?16:2,width:14,height:14,borderRadius:"50%",background:"#fff",transition:"left .15s"}}/>
                    </button>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:600,color:"var(--text)"}}>{r.name||p?.label||"Rule"}</div>
                      <div style={{fontSize:10,color:"var(--muted)",fontFamily:"var(--mono)",marginTop:2}}>
                        {p?.label||r.preset_type}
                        {p?.direction&&r.direction&&r.direction!=="any"&&` · ${r.direction==="up"?"↑ increased":"↓ decreased"}`}
                        {p?.threshold&&Number(r.min_pct_change)>0&&` · ≥${r.min_pct_change}%`}
                        {` · watch ${r.days_offset||14}d`}
                      </div>
                    </div>
                    <button className="nc-btn nc-btn-edit" style={{fontSize:10,padding:"3px 8px"}} onClick={()=>handleEditRule(r)}>Edit</button>
                    <button className="nc-btn nc-btn-del" style={{fontSize:10,padding:"3px 8px"}} onClick={()=>handleDeleteRule(r.id)}>Delete</button>
                  </div>
                );})}
              </div>)}

              {!ruleForm.show&&(<button className="btn-save" onClick={()=>setRuleForm(f=>({...f,show:true}))} style={{width:"100%"}}>+ Add Rule</button>)}

              {ruleForm.show&&(<div style={{border:"1px solid var(--border)",borderRadius:10,padding:14,background:"var(--bg)"}}>
                <div style={{fontSize:12,fontWeight:600,marginBottom:10}}>{ruleForm.id?"Edit rule":"New rule"}</div>

                <div style={{marginBottom:10}}>
                  <div className="meta-label" style={{marginBottom:5}}>Trigger</div>
                  <select value={ruleForm.preset_type} onChange={e=>setRuleForm(f=>({...f,preset_type:e.target.value,direction:"any",min_pct_change:0}))} className="search-input" style={{width:"100%",fontFamily:"var(--sans)",fontSize:12}}>
                    {Object.entries(RULE_PRESETS).map(([k,v])=>(<option key={k} value={k}>{v.label}</option>))}
                  </select>
                  <div style={{fontSize:10,color:"var(--muted)",marginTop:4}}>{preset.hint}</div>
                </div>

                {preset.direction&&(<div style={{marginBottom:10}}>
                  <div className="meta-label" style={{marginBottom:5}}>Direction</div>
                  <div style={{display:"flex",gap:5}}>
                    {[["any","Any change"],["up","↑ Increased only"],["down","↓ Decreased only"]].map(([v,label])=>(<button key={v} onClick={()=>setRuleForm(f=>({...f,direction:v}))} className="pill" style={ruleForm.direction===v?{background:"var(--blue-bg)",borderColor:"var(--blue-border)",color:"var(--blue)",fontWeight:600}:{}}>{label}</button>))}
                  </div>
                </div>)}

                {preset.threshold&&(<div style={{marginBottom:10}}>
                  <div className="meta-label" style={{marginBottom:5}}>Minimum % change <span style={{color:"var(--muted)",fontWeight:400}}>(0 = any)</span></div>
                  <input type="number" min="0" step="1" value={ruleForm.min_pct_change} onChange={e=>setRuleForm(f=>({...f,min_pct_change:e.target.value}))} className="search-input" style={{fontFamily:"var(--mono)",width:120}}/>
                </div>)}

                <div style={{marginBottom:10}}>
                  <div className="meta-label" style={{marginBottom:5}}>Watch for (days from event date)</div>
                  <input type="number" min="1" step="1" value={ruleForm.days_offset} onChange={e=>setRuleForm(f=>({...f,days_offset:e.target.value}))} className="search-input" style={{fontFamily:"var(--mono)",width:120}}/>
                </div>

                <div style={{marginBottom:10}}>
                  <div className="meta-label" style={{marginBottom:5}}>Rule name <span style={{color:"var(--muted)",fontWeight:400}}>(optional)</span></div>
                  <input className="search-input" placeholder={preset.label||"My rule"} value={ruleForm.name} onChange={e=>setRuleForm(f=>({...f,name:e.target.value}))}/>
                </div>

                <div style={{marginBottom:14}}>
                  <div className="meta-label" style={{marginBottom:5}}>Hypothesis template</div>
                  <input className="search-input" value={ruleForm.hypothesis_template} onChange={e=>setRuleForm(f=>({...f,hypothesis_template:e.target.value}))} style={{fontSize:12}}/>
                  <div style={{fontSize:10,color:"var(--muted)",marginTop:4}}>Use <code style={{fontFamily:"var(--mono)"}}>{"{summary}"}</code> to insert the change summary</div>
                </div>

                <div style={{display:"flex",gap:8}}>
                  <button className="btn-save" onClick={handleSaveRule} style={{flex:1}}>{ruleForm.id?"Save Changes":"Create Rule"}</button>
                  <button className="nc-btn" onClick={()=>setRuleForm({id:null,name:"",preset_type:"tcpa_changed",direction:"any",min_pct_change:0,days_offset:14,hypothesis_template:"Auto-watch: {summary}",enabled:true,show:false})}>Cancel</button>
                </div>
              </div>)}

              {rules.length===0&&!ruleForm.show&&(<div style={{marginTop:14,fontSize:11,color:"var(--muted)",fontStyle:"italic"}}>No rules yet. Add one to auto-create watch items for matching changes.</div>)}
            </div>
          </div>
        );})()}
      </div>
    </>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
